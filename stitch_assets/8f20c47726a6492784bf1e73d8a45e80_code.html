<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Ambient Shadow for Auth Card */
        .ambient-shadow {
            box-shadow: 0 20px 40px -15px rgba(15, 67, 111, 0.15);
        }
        
        /* Input Focus Ring */
        .input-ring:focus-within {
            box-shadow: 0 0 0 3px rgba(197, 236, 202, 0.4);
        }
        
        /* Button Squish */
        .btn-squish:active {
            transform: scale(0.98);
        }
    </style>

<body class="bg-background min-h-screen flex flex-col items-center justify-center font-body-md text-on-surface antialiased p-4">
<!-- Intent implies linear transactional flow (Login). Suppressing standard navigation shell. -->
<header class="w-full top-0 px-container-padding py-stack-lg bg-transparent flex justify-center items-center absolute max-w-auth mx-auto">
<h1 class="font-display text-display-mobile md:text-display font-bold text-primary dark:text-primary-fixed">ZapCond</h1>
</header>
<main class="w-full flex-grow flex flex-col items-center justify-center max-w-[max-width-auth]">
<!-- Auth Card -->
<div class="w-full bg-surface-container-lowest rounded-t-2xl rounded-b-2xl md:rounded-2xl p-container-padding ambient-shadow relative overflow-hidden">
<!-- Minimalist Logo -->
<div class="flex justify-center mb-stack-lg">
<img alt="ZapCond Logo" class="h-16 w-16 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLvwyDUwtXN0DuiS7L9uuVezkzh68EEAbh1Dn1M-E3HjHofQ4E0XkRdZcEiUFGqEiol4I4Mmk6fL1wuIJpMWiQntkKakYInGHBFiL_1Hj03so0gT8d3kamWaTjhV_MrAwDpBKt4Z-rpKRzTjvdleWQ0vKUMqdOs_BIUUK5wmrgeDjZXj_pTKQ7wV49x5uJDPGqEE1l1tkn1rmQJmUql6u3WWgPeNU8PXPn1rmOdCmIQxymZWWKUCHYvTDP7A"/>
</div>
<!-- Header -->
<div class="text-center mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Bem-vindo de volta</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Faça login para acessar seu refúgio.</p>
</div>
<!-- Inline Error Example (Hidden by default, shown for example) -->
<div class="mb-stack-md bg-error-container text-on-error-container p-3 rounded-lg flex items-start gap-2 text-sm" role="alert">
<span class="material-symbols-outlined text-error" data-weight="fill" style="font-size: 20px;">error</span>
<span>Credenciais inválidas. Por favor, verifique seu e-mail e senha.</span>
</div>
<form class="space-y-stack-lg">
<!-- Email Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="email">E-mail</label>
<div class="relative input-ring rounded-2xl transition-shadow duration-200">
<input class="w-full bg-surface-container-low border border-surface-variant text-on-surface rounded-2xl px-4 py-3 pl-11 focus:outline-none focus:border-primary transition-colors duration-200 placeholder:text-outline" id="email" name="email" placeholder="seu@email.com" required="" type="email"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Senha</label>
<a class="font-label-sm text-label-sm text-primary hover:underline focus:outline-none focus:ring-2 focus:ring-secondary-fixed focus:ring-offset-2 rounded px-1 transition-colors" href="#">Esqueceu a senha?</a>
</div>
<div class="relative input-ring rounded-2xl transition-shadow duration-200">
<input aria-invalid="true" class="w-full bg-surface-container-low border border-error text-on-surface rounded-2xl px-4 py-3 pl-11 pr-11 focus:outline-none focus:border-primary transition-colors duration-200 placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-error mt-1">A senha é obrigatória.</p>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-4 rounded-2xl btn-squish transition-transform duration-200 hover:opacity-90 focus:outline-none focus:ring-4 focus:ring-primary-container" type="submit">
                    Entrar
                </button>
</form>
</div>
</main>
<!-- Footer -->
<footer class="w-full bottom-0 py-stack-lg bg-transparent flex flex-col items-center gap-stack-sm max-w-auth mx-auto mt-stack-xl">
<div class="flex gap-4">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors opacity-100 hover:opacity-80" href="#">Privacidade</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors opacity-100 hover:opacity-80" href="#">Termos</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors opacity-100 hover:opacity-80" href="#">Suporte</a>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant text-center">© 2024 ZapCond. Protegendo seu refúgio digital.</p>
</footer>
