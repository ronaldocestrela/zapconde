            box-shadow: 0 0 0 2px theme('colors.secondary-container');

<body class="h-full bg-background flex flex-col items-center justify-center p-4">
<!-- Auth Container -->
<main class="w-full max-w-auth mx-auto bg-tertiary-fixed rounded-2xl shadow-[0_8px_30px_rgb(15,67,111,0.15)] overflow-hidden flex flex-col">
<!-- Inner Padding Wrapper -->
<div class="px-container-padding py-stack-xl flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-stack-lg w-24 h-24 rounded-full bg-surface flex items-center justify-center shadow-sm">
<img alt="ZapCond Logo" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLvwyDUwtXN0DuiS7L9uuVezkzh68EEAbh1Dn1M-E3HjHofQ4E0XkRdZcEiUFGqEiol4I4Mmk6fL1wuIJpMWiQntkKakYInGHBFiL_1Hj03so0gT8d3kamWaTjhV_MrAwDpBKt4Z-rpKRzTjvdleWQ0vKUMqdOs_BIUUK5wmrgeDjZXj_pTKQ7wV49x5uJDPGqEE1l1tkn1rmQJmUql6u3WWgPeNU8PXPn1rmOdCmIQxymZWWKUCHYvTDP7A"/>
</div>
<!-- Header Text -->
<div class="text-center mb-stack-lg w-full">
<h1 class="font-display-mobile text-display-mobile md:font-display md:text-display text-on-tertiary-fixed mb-2">Bem-vindo de volta</h1>
<p class="font-body-md text-body-md text-on-tertiary-fixed-variant">Acesse seu refúgio digital com segurança.</p>
</div>
<!-- Form -->
<form class="w-full space-y-stack-md flex flex-col">
<!-- Email Input Group -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-tertiary-fixed-variant pl-1" for="email">E-mail</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">mail</span>
</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface rounded-2xl border border-outline-variant text-on-surface font-body-md text-body-md focus:border-primary focus:ring-0 input-glow transition-all duration-200 ease-in-out placeholder:text-outline-variant" id="email" placeholder="seu@email.com" type="email"/>
</div>
</div>
<!-- Password Input Group -->
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center pl-1">
<label class="font-label-md text-label-md text-on-tertiary-fixed-variant" for="password">Senha</label>
<a class="font-label-sm text-label-sm text-primary hover:opacity-80 transition-opacity" href="#">Esqueceu a senha?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">lock</span>
</span>
<input class="w-full h-14 pl-12 pr-12 bg-surface rounded-2xl border border-outline-variant text-on-surface font-body-md text-body-md focus:border-primary focus:ring-0 input-glow transition-all duration-200 ease-in-out placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-4 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<!-- Spacer -->
<div class="h-2"></div>
<!-- Primary CTA -->
<button class="w-full h-14 bg-primary text-on-primary font-headline-sm text-headline-sm rounded-2xl active:scale-[0.98] transition-transform duration-200 flex items-center justify-center gap-2 shadow-sm hover:opacity-90" type="submit">
                    Entrar
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<!-- Secondary Action -->
<div class="text-center mt-stack-md pt-4">
<p class="font-body-md text-body-md text-on-tertiary-fixed-variant">
                        Não tem uma conta? 
                        <a class="font-headline-sm text-headline-sm text-primary underline hover:opacity-80 transition-opacity" href="#">Cadastre-se</a>
</p>
</div>
</form>
</div>
</main>
<!-- Footer Component from JSON -->
<footer class="mt-8 flex flex-col items-center gap-stack-sm w-full max-w-auth mx-auto py-stack-lg bg-transparent">
<div class="flex gap-4 mb-2">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors opacity-100 hover:opacity-80" href="#">Privacidade</a>
<span class="text-on-surface-variant font-label-sm">•</span>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors opacity-100 hover:opacity-80" href="#">Termos</a>
<span class="text-on-surface-variant font-label-sm">•</span>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors opacity-100 hover:opacity-80" href="#">Suporte</a>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant text-center">
            © 2024 ZapCond. Protegendo seu refúgio digital.
        </p>
</footer>
</body></html>
